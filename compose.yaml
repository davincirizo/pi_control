name: picontrol
services:
  picontrol:
    build: .
    image: picontrol:local
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: America/Chicago
    volumes:
      - picontrol_data:/app/data
      - ./config.example.json:/app/config.example.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/state', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  picontrol_data:
